<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuroG18 - Khám Phá & Tải Game Hay</title>
    <!-- Icon logo hiển thị trực tiếp trên tab trình duyệt -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f43f5e%22/><text x=%2250%%22 y=%2255%%22 font-size=%2245%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-family=%22sans-serif%22>R18</text></svg>" type="image/svg+xml">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK CDN và Khởi tạo -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCgu-00ZXILANFFdH9cQ_VrZRaNm-ywA4",
          authDomain: "kurog-5359b.firebaseapp.com",
          projectId: "kurog-5359b",
          storageBucket: "kurog-5359baspectstorage.app",
          messagingSenderId: "260394082482",
          appId: "1:260394082482:web:8690b9903c7758bffffa9ab",
          measurementId: "G-4H03KJFZ7G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Đưa các hàm và biến Firebase ra phạm vi toàn cục
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;

        // Tải danh sách game từ Firestore ngay khi trang khởi động
        if (typeof window.loadGamesFromFirestore === 'function') {
            window.loadGamesFromFirestore();
        }
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #1e2538;
            --star-color: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-badge {
            background: linear-gradient(135deg, #f43f5e, #8b5cf6);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Thanh tìm kiếm */
        .search-bar {
            position: relative;
            width: 45px; 
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-bar.active {
            width: 250px; 
        }

        .search-bar input {
            width: 100%;
            padding: 0.5rem 0.8rem 0.5rem 2.3rem;
            font-size: 0.85rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-bar.active input {
            border-color: var(--accent-color);
            cursor: text;
        }

        .search-bar i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.1);
        }

        #openUploadModal, #userAccountSection {
            display: none;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 5%;
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .game-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .game-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .game-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .game-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: auto;
        }

        .game-stats {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Trang Chi Tiết Game */
        #gameDetailView {
            display: none;
        }

        .detail-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .back-nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--text-main);
        }

        .hero-banner {
            position: relative;
            width: 100%;
            height: 450px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .hero-overlay-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 55%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
            border-right: 1px solid var(--border-color);
        }

        @media (max-width: 900px) {
            .hero-overlay-box {
                width: 100%;
                height: auto;
            }
            .hero-banner {
                height: auto;
            }
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .hero-stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            gap: 20px;
            margin-top: 0.5rem;
        }

        .detail-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .detail-section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .wp-content {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-main);
        }

        .wp-content p {
            margin-bottom: 1rem;
            color: var(--text-muted);
        }

        .wp-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 1rem 0;
            border: 1px solid var(--border-color);
            display: block;
        }

        .download-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: var(--bg-color);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .download-group {
            border-left: 3px solid var(--accent-color);
            padding-left: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .download-group-title {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .server-link-item {
            color: var(--accent-color);
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s;
        }

        .server-link-item:hover {
            color: var(--accent-hover);
        }

        /* Phần Đánh Giá Sao & Bình Luận */
        .rating-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            padding: 1.2rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .stars-container {
            display: flex;
            gap: 5px;
            cursor: pointer;
        }

        .stars-container i {
            font-size: 1.5rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .stars-container i.active, .stars-container i:hover {
            color: var(--star-color);
        }

        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .comment-input-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comment-textarea {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            resize: vertical;
            min-height: 90px;
            font-size: 0.9rem;
        }

        .comment-textarea:focus {
            border-color: var(--accent-color);
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-item {
            background-color: var(--bg-color);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .comment-author {
            font-weight: 600;
            color: #38bdf8;
        }

        .comment-body {
            font-size: 0.9rem;
            color: var(--text-main);
            word-break: break-word;
        }

        /* Modal Chung */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem 1rem;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .password-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input-container input {
            padding-right: 45px;
            background-color: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .password-input-container input:focus {
            border-color: var(--accent-color);
        }

        .toggle-password-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-password-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.15);
        }

        .styled-input {
            background-color: var(--input-bg) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 8px !important;
        }

        .styled-input:focus {
            border-color: var(--accent-color) !important;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .link-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }

        .link-row select, .link-row input {
            padding: 0.6rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .editor-toolbar {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            padding: 0.5rem;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            background-color: var(--accent-color);
        }

        .editor-content-area {
            width: 100%;
            min-height: 180px;
            max-height: 300px;
            overflow-y: auto;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            padding: 1rem;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <header>
        <a onclick="showHome()" class="logo">
            <span class="logo-badge">R18+</span>
            KuroG18
        </a>
        <div class="search-bar" id="searchContainer">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm game...">
        </div>
        <div class="nav-actions">
            <!-- Nút Đăng Game Mới (Chỉ hiện khi là Admin) -->
            <button class="btn btn-primary" id="openUploadModal"><i class="fa-solid fa-plus"></i> Đăng Game Mới</button>
            
            <!-- Khu vực tài khoản (Chưa đăng nhập) -->
            <button class="btn btn-outline" id="openAuthModalBtn" onclick="openAuthModal('login')"><i class="fa-solid fa-user"></i> Đăng Nhập</button>

            <!-- Khu vực tài khoản (Đã đăng nhập) -->
            <div id="userAccountSection" style="display: flex; align-items: center; gap: 10px;">
                <span id="userNameDisplay" style="font-size: 0.9rem; font-weight: 600; color: #38bdf8;"></span>
                <button class="btn btn-outline" onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- TRANG CHỦ -->
        <div id="homeView">
            <h2 class="section-title">Danh Sách Game</h2>
            <div class="game-grid" id="gameGrid"></div>
        </div>

        <!-- TRANG CHI TIẾT GAME -->
        <div id="gameDetailView">
            <div class="back-nav-row">
                <button class="back-btn" onclick="showHome()"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</button>
                <!-- Nút Xóa Game (Chỉ Admin mới thấy) -->
                <button class="btn btn-danger" id="deleteGameBtn" style="display: none;"><i class="fa-solid fa-trash"></i> Xóa Bài Viết</button>
            </div>
            <div class="detail-wrapper" id="detailWrapper" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <!-- Modal Đăng Nhập / Đăng Ký -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLoginBtn" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button class="auth-tab" id="tabRegisterBtn" onclick="switchAuthTab('register')">Đăng Ký Tài Khoản</button>
            </div>

            <!-- Form Đăng Nhập -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="styled-input" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="password-input-container">
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">Đăng Nhập</button>
            </form>

            <!-- Form Đăng Ký -->
            <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" class="styled-input" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="password-input-container">
                        <input type="password" id="regPassword" required placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regPassword', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>
                    <div class="password-input-container">
                        <input type="password" id="regConfirmPassword" required placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regConfirmPassword', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">Đăng Ký</button>
            </form>
        </div>
    </div>

    <!-- Modal Đăng Game -->
    <div class="modal" id="uploadModal">
        <div class="modal-content" style="max-width: 800px;">
            <button class="close-btn" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Đăng Tải Game & Quản Lý Link</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Tên Game</label>
                    <input type="text" id="gameTitle" required placeholder="Nhập tên game...">
                </div>
                <div class="form-group">
                    <label>Ảnh Thumbnail Chính (Hiển thị trang chủ & làm nền banner)</label>
                    <input type="file" id="gameImageFile" accept="image/*" required>
                </div>

                <!-- Danh Sách Link Tải -->
                <div class="form-group">
                    <label>Danh Sách Link Tải (PC / Android với các Server khác nhau)</label>
                    <div id="downloadLinksContainer">
                        <div class="link-row">
                            <select class="platform-select" style="width: 25%;">
                                <option value="Bản PC">Bản PC</option>
                                <option value="Bản Android">Bản Android</option>
                            </select>
                            <input type="text" class="server-name" placeholder="Tên server (Mega, Pixel...)" style="width: 25%;" required>
                            <input type="url" class="server-url" placeholder="Đường dẫn https://..." style="width: 40%;" required>
                            <button type="button" onclick="this.parentElement.remove()" style="background: #ef4444; border:none; color:white; padding: 6px 10px; border-radius:4px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <button type="button" class="btn" onclick="addDownloadLinkRow()" style="margin-top: 8px; background: #334155; font-size: 0.85rem; padding: 0.4rem 0.8rem;"><i class="fa-solid fa-plus"></i> Thêm Link Server Khác</button>
                </div>

                <!-- Trình soạn thảo -->
                <div class="form-group">
                    <label>Nội dung bài viết / Giới thiệu chi tiết</label>
                    <div class="editor-toolbar">
                        <button type="button" class="toolbar-btn" onclick="formatText('bold')"><i class="fa-solid fa-bold"></i> Đậm</button>
                        <button type="button" class="toolbar-btn" onclick="formatText('italic')"><i class="fa-solid fa-italic"></i> Nghiêng</button>
                        <button type="button" class="toolbar-btn" onclick="formatText('formatBlock', 'H2')"><i class="fa-solid fa-heading"></i> H2</button>
                        <button type="button" class="toolbar-btn" onclick="insertImageToEditor()"><i class="fa-solid fa-image"></i> Chèn Ảnh</button>
                    </div>
                    <div id="wpEditor" class="editor-content-area" contenteditable="true" placeholder="Soạn thảo nội dung giới thiệu..."></div>
                    <input type="file" id="editorImageInput" accept="image/*" style="display: none;" onchange="handleEditorImageUpload(event)">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; font-size: 1rem;">Đăng Bài Lên Website</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 KuroG18. Nền tảng chia sẻ game cộng đồng.</p>
    </footer>

    <script>
        let games = [];
        let users = JSON.parse(localStorage.getItem('kuro_users')) || [
            { email: "admin@gmail.com", password: "1234567890!@#$%^&*()", role: "admin" }
        ];
        
        let currentUser = null;

        const gameGrid = document.getElementById('gameGrid');
        const homeView = document.getElementById('homeView');
        const gameDetailView = document.getElementById('gameDetailView');
        const detailWrapper = document.getElementById('detailWrapper');
        const deleteGameBtn = document.getElementById('deleteGameBtn');
        
        const uploadModal = document.getElementById('uploadModal');
        const openUploadModal = document.getElementById('openUploadModal');
        const closeModal = document.getElementById('closeModal');
        const uploadForm = document.getElementById('uploadForm');
        const searchInput = document.getElementById('searchInput');
        const searchContainer = document.getElementById('searchContainer');
        const wpEditor = document.getElementById('wpEditor');
        
        const authModal = document.getElementById('authModal');
        const openAuthModalBtn = document.getElementById('openAuthModalBtn');
        const userAccountSection = document.getElementById('userAccountSection');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabRegisterBtn = document.getElementById('tabRegisterBtn');

        searchInput.addEventListener('focus', () => { searchContainer.classList.add('active'); });
        searchInput.addEventListener('blur', () => {
            if (searchInput.value.trim() === '') { searchContainer.classList.remove('active'); }
        });

        // Hàm tải danh sách game từ Cloud Firestore
        async function loadGamesFromFirestore() {
            if (!window.db) return;
            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "games"));
                games = [];
                querySnapshot.forEach((docSnap) => {
                    games.push({ firestoreId: docSnap.id, ...docSnap.data() });
                });
                games.sort((a, b) => b.id - a.id);
                filterAndRender();
            } catch (error) {
                console.error("Lỗi khi tải game từ Firestore: ", error);
            }
        }
        window.loadGamesFromFirestore = loadGamesFromFirestore;

        // Bật/tắt ẩn hiện mật khẩu
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Cập nhật giao diện tài khoản
        function updateAuthUI() {
            if (currentUser) {
                openAuthModalBtn.style.display = 'none';
                userAccountSection.style.display = 'flex';
                userNameDisplay.textContent = currentUser.email.split('@')[0];
                
                if (currentUser.role === 'admin') {
                    openUploadModal.style.display = 'flex';
                } else {
                    openUploadModal.style.display = 'none';
                }
            } else {
                openAuthModalBtn.style.display = 'inline-flex';
                userAccountSection.style.display = 'none';
                openUploadModal.style.display = 'none';
            }
        }

        function openAuthModal(tab = 'login') {
            authModal.style.display = 'flex';
            switchAuthTab(tab);
        }

        function closeAuthModal() {
            authModal.style.display = 'none';
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                alert("Mật khẩu xác nhận không trùng khớp!");
                return;
            }

            if (users.some(u => u.email === email)) {
                alert("Email này đã được sử dụng để đăng ký!");
                return;
            }

            const newUser = { email, password, role: "user" };
            users.push(newUser);
            localStorage.setItem('kuro_users', JSON.stringify(users));

            alert("Đăng ký tài khoản thành công! Bạn có thể đăng nhập ngay.");
            switchAuthTab('login');
            registerForm.reset();
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const foundUser = users.find(u => u.email === email && u.password === password);
            if (foundUser) {
                currentUser = foundUser;
                updateAuthUI();
                closeAuthModal();
                alert("Đăng nhập thành công!");
                loginForm.reset();
            } else {
                alert("Sai Email hoặc mật khẩu!");
            }
        }

        function logout() {
            currentUser = null;
            updateAuthUI();
            deleteGameBtn.style.display = 'none';
            alert("Đã đăng xuất!");
        }

        function addDownloadLinkRow() {
            const container = document.getElementById('downloadLinksContainer');
            const row = document.createElement('div');
            row.className = 'link-row';
            row.innerHTML = `
                <select class="platform-select" style="width: 25%;">
                    <option value="Bản PC">Bản PC</option>
                    <option value="Bản Android">Bản Android</option>
                </select>
                <input type="text" class="server-name" placeholder="Tên server (Mega, Pixel...)" style="width: 25%;" required>
                <input type="url" class="server-url" placeholder="Đường dẫn https://..." style="width: 40%;" required>
                <button type="button" onclick="this.parentElement.remove()" style="background: #ef4444; border:none; color:white; padding: 6px 10px; border-radius:4px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(row);
        }

        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            wpEditor.focus();
        }

        function insertImageToEditor() {
            document.getElementById('editorImageInput').click();
        }

        function handleEditorImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgHtml = `<img src="${e.target.result}" alt="Image" />`;
                    document.execCommand('insertHTML', false, imgHtml);
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function renderGames(gamesToRender) {
            gameGrid.innerHTML = '';
            if (gamesToRender.length === 0) {
                gameGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Chưa có tựa game nào được đăng.</p>`;
                return;
            }

            gamesToRender.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGameDetail(game.id);

                let avgRating = 0;
                if (game.ratings && game.ratings.length > 0) {
                    const sum = game.ratings.reduce((a, b) => a + b.star, 0);
                    avgRating = (sum / game.ratings.length).toFixed(1);
                }

                card.innerHTML = `
                    <img src="${game.image}" alt="${game.title}" class="game-thumbnail">
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-desc">${game.shortDesc}</p>
                        <div class="game-footer">
                            <div class="game-stats">
                                <div><span><i class="fa-solid fa-star" style="color: var(--star-color);"></i></span> <span>${avgRating} (${game.ratings ? game.ratings.length : 0})</span></div>
                                <div><span><i class="fa-solid fa-eye"></i></span> <span>${game.views} Views</span></div>
                            </div>
                        </div>
                    </div>
                `;
                gameGrid.appendChild(card);
            });
        }

        async function openGameDetail(id) {
            const game = games.find(g => g.id == id);
            if (!game) return;

            // Tăng lượt view và cập nhật trực tiếp lên Firestore
            game.views++;
            try {
                if (game.firestoreId && window.db) {
                    await window.updateDoc(window.doc(window.db, "games", game.firestoreId), {
                        views: game.views
                    });
                }
            } catch (err) {
                console.error(err);
            }

            if (currentUser && currentUser.role === 'admin') {
                deleteGameBtn.style.display = 'inline-flex';
                deleteGameBtn.onclick = () => deleteGame(game.id);
            } else {
                deleteGameBtn.style.display = 'none';
            }

            let groupedLinks = {};
            game.downloadLinks.forEach(item => {
                if (!groupedLinks[item.platform]) {
                    groupedLinks[item.platform] = [];
                }
                groupedLinks[item.platform].push(item);
            });

            let downloadBoxesHTML = '';
            for (let platform in groupedLinks) {
                let serversHTML = groupedLinks[platform].map(s => `<a href="${s.url}" target="_blank" class="server-link-item">${s.name}</a>`).join(' | ');
                downloadBoxesHTML += `
                    <div class="download-group">
                        <div class="download-group-title">${platform}: ${serversHTML}</div>
                    </div>
                `;
            }

            if (!game.ratings) game.ratings = [];
            let avgRating = 0;
            if (game.ratings.length > 0) {
                const sum = game.ratings.reduce((a, b) => a + b.star, 0);
                avgRating = (sum / game.ratings.length).toFixed(1);
            }

            let userExistingRating = 0;
            if (currentUser) {
                let found = game.ratings.find(r => r.userEmail === currentUser.email);
                if (found) userExistingRating = found.star;
            }

            let starsHTML = '';
            for (let i = 1; i <= 5; i++) {
                let activeClass = i <= userExistingRating ? 'active' : '';
                starsHTML += `<i class="fa-solid fa-star ${activeClass}" onclick="rateGame(${game.id}, ${i})"></i>`;
            }

            if (!game.comments) game.comments = [];
            let commentsHTML = game.comments.map(c => `
                <div class="comment-item">
                    <div class="comment-header">
                        <span class="comment-author">${c.author}</span>
                        <span>${c.date}</span>
                    </div>
                    <div class="comment-body">${c.content}</div>
                </div>
            `).join('');

            if (commentsHTML === '') {
                commentsHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">Chưa có bình luận nào. Hãy là người đầu tiên bình luận!</p>`;
            }

            detailWrapper.innerHTML = `
                <div class="hero-banner">
                    <img src="${game.image}" alt="${game.title}" class="hero-bg-img">
                    <div class="hero-overlay-box">
                        <h1 class="hero-title">${game.title}</h1>
                        <div class="hero-stats">
                            <div><i class="fa-solid fa-star" style="color: var(--star-color);"></i> ${avgRating} (${game.ratings.length} đánh giá)</div>
                            <div><i class="fa-solid fa-eye"></i> ${game.views} Views</div>
                        </div>
                    </div>
                </div>

                <div class="detail-card">
                    <div>
                        <h3 class="detail-section-title">Đánh Giá Game (Tối Đa 5 Sao)</h3>
                        <div class="rating-box">
                            <div>
                                <div style="font-weight: 500; font-size: 0.95rem; margin-bottom: 5px;">Chọn số sao đánh giá của bạn:</div>
                                <div class="stars-container" id="starContainer_${game.id}">
                                    ${starsHTML}
                                </div>
                            </div>
                            <div style="margin-left: auto; font-size: 0.9rem; color: var(--text-muted);">
                                Trung bình: <strong style="color: var(--star-color); font-size: 1.1rem;">${avgRating} / 5</strong> (${game.ratings.length} lượt)
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="detail-section-title">Nội Dung Giới Thiệu</h3>
                        <div class="wp-content">${game.fullHtmlContent}</div>
                    </div>

                    <div>
                        <h3 class="detail-section-title">Phần Tải Xuống</h3>
                        <div class="download-container">
                            <div style="font-weight: 600; font-size: 1rem; color: var(--text-main);">Tải Game Về Máy:</div>
                            ${downloadBoxesHTML}
                        </div>
                    </div>

                    <div>
                        <h3 class="detail-section-title">Bình Luận (${game.comments.length})</h3>
                        <div class="comments-section">
                            <div class="comment-input-box">
                                <textarea id="commentInputContent" class="comment-textarea" placeholder="${currentUser ? 'Viết bình luận của bạn...' : 'Vui lòng đăng nhập để bình luận...'}"></textarea>
                                <button type="button" class="btn btn-primary" onclick="submitComment(${game.id})" style="align-self: flex-end; padding: 0.5rem 1.2rem; font-size: 0.85rem;"><i class="fa-solid fa-paper-plane"></i> Gửi Bình Luận</button>
                            </div>
                            <div class="comment-list">
                                ${commentsHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            homeView.style.display = 'none';
            gameDetailView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Xóa game trực tiếp từ Firestore
        async function deleteGame(gameId) {
            if (!currentUser || currentUser.role !== 'admin') {
                alert("Bạn không có quyền thực hiện hành động này!");
                return;
            }

            if (confirm("Bạn có chắc chắn muốn xóa vĩnh viễn bài viết game này không?")) {
                try {
                    const targetGame = games.find(g => g.id == gameId);
                    if (targetGame && targetGame.firestoreId && window.db) {
                        await window.deleteDoc(window.doc(window.db, "games", targetGame.firestoreId));
                        alert("Đã xóa bài viết game thành công!");
                        showHome();
                        loadGamesFromFirestore();
                    }
                } catch (error) {
                    alert("Lỗi khi xóa game: " + error.message);
                }
            }
        }

        // Đánh giá sao (Cập nhật lên Firestore)
        async function rateGame(gameId, starCount) {
            if (!currentUser) {
                alert("Bạn cần đăng nhập tài khoản để đánh giá game!");
                openAuthModal('login');
                return;
            }

            const game = games.find(g => g.id == gameId);
            if (!game) return;

            if (!game.ratings) game.ratings = [];

            let existingIndex = game.ratings.findIndex(r => r.userEmail === currentUser.email);
            if (existingIndex !== -1) {
                game.ratings[existingIndex].star = starCount;
            } else {
                game.ratings.push({ userEmail: currentUser.email, star: starCount });
            }

            try {
                if (game.firestoreId && window.db) {
                    await window.updateDoc(window.doc(window.db, "games", game.firestoreId), {
                        ratings: game.ratings
                    });
                }
            } catch (err) {
                console.error(err);
            }

            alert(`Cảm ơn bạn đã đánh giá ${starCount} sao cho game!`);
            openGameDetail(gameId);
        }

        // Gửi bình luận (Cập nhật lên Firestore)
        async function submitComment(gameId) {
            if (!currentUser) {
                alert("You need to log in to comment!");
                openAuthModal('login');
                return;
            }

            const contentBox = document.getElementById('commentInputContent');
            const content = contentBox.value.trim();

            if (!content) {
                alert("Nội dung bình luận không được để trống!");
                return;
            }

            const game = games.find(g => g.id == gameId);
            if (!game) return;

            if (!game.comments) game.comments = [];

            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            game.comments.unshift({
                author: currentUser.email.split('@')[0],
                content: content,
                date: dateStr
            });

            try {
                if (game.firestoreId && window.db) {
                    await window.updateDoc(window.doc(window.db, "games", game.firestoreId), {
                        comments: game.comments
                    });
                }
            } catch (err) {
                console.error(err);
            }

            contentBox.value = '';
            openGameDetail(gameId);
        }

        function showHome() {
            gameDetailView.style.display = 'none';
            homeView.style.display = 'block';
            filterAndRender();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        openUploadModal.addEventListener('click', () => { uploadModal.style.display = 'flex'; });
        closeModal.addEventListener('click', () => { uploadModal.style.display = 'none'; });
        window.addEventListener('click', (e) => { 
            if (e.target === uploadModal) { uploadModal.style.display = 'none'; }
            if (e.target === authModal) { authModal.style.display = 'none'; }
        });

        // Đăng game mới lên Firestore
        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const imageFileInput = document.getElementById('gameImageFile');
            const file = imageFileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    const mainImageBase64 = event.target.result;
                    const htmlContent = wpEditor.innerHTML;
                    
                    let linksArray = [];
                    const linkRows = document.querySelectorAll('.link-row');
                    linkRows.forEach(row => {
                        const platform = row.querySelector('.platform-select').value;
                        const name = row.querySelector('.server-name').value;
                        const url = row.querySelector('.server-url').value;
                        if(name && url) {
                            linksArray.push({ platform, name, url });
                        }
                    });

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlContent;
                    const plainTextDesc = tempDiv.textContent || tempDiv.innerText || "";

                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const year = now.getFullYear();
                    const formattedDate = `${day}/${month}/${year}`;

                    const newGame = {
                        id: Date.now(),
                        title: document.getElementById('gameTitle').value,
                        image: mainImageBase64,
                        downloadLinks: linksArray,
                        shortDesc: plainTextDesc.substring(0, 100) + '...',
                        fullHtmlContent: htmlContent,
                        views: 0,
                        uploadDate: formattedDate,
                        ratings: [],
                        comments: []
                    };

                    try {
                        if (window.db && window.addDoc && window.collection) {
                            await window.addDoc(window.collection(window.db, "games"), newGame);
                            alert("Đăng bài lên đám mây thành công!");
                            uploadForm.reset();
                            wpEditor.innerHTML = '';
                            uploadModal.style.display = 'none';
                            loadGamesFromFirestore();
                        } else {
                            alert("Firebase chưa sẵn sàng, vui lòng thử lại sau giây lát.");
                        }
                    } catch (error) {
                        alert("Lỗi khi đăng game: " + error.message);
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        searchInput.addEventListener('input', () => { filterAndRender(); });

        function filterAndRender() {
            const keyword = searchInput.value.toLowerCase();
            let filtered = games.filter(game => {
                return game.title.toLowerCase().includes(keyword) || game.shortDesc.toLowerCase().includes(keyword);
            });
            renderGames(filtered);
        }

        // Chạy khởi tạo ban đầu
        updateAuthUI();
    </script>
</body>

</html>
