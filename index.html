<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuroG18 - Khám Phá & Tải Game Hay</title>

    <!-- Icon logo hiển thị trực tiếp trên tab trình duyệt -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23f43f5e%22/><text x=%2250%%22 y=%2255%%22 font-size=%2245%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-family=%22sans-serif%22>R18</text></svg>" type="image/svg+xml">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #1e2538;
            --star-color: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-badge {
            background: linear-gradient(135deg, #f43f5e, #8b5cf6);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Thanh tìm kiếm */
        .search-bar {
            position: relative;
            width: 45px; 
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-bar.active {
            width: 250px; 
        }

        .search-bar input {
            width: 100%;
            padding: 0.5rem 0.8rem 0.5rem 2.3rem;
            font-size: 0.85rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-bar.active input {
            border-color: var(--accent-color);
            cursor: text;
        }

        .search-bar i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.1);
        }

        #userAccountSection {
            display: none;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 5%;
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .game-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .game-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .game-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .game-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: auto;
        }

        .game-stats {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Trang Chi Tiết Game */
        #gameDetailView {
            display: none;
        }

        .detail-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .back-nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--text-main);
        }

        .hero-banner {
            position: relative;
            width: 100%;
            height: 450px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .hero-overlay-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 55%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
            border-right: 1px solid var(--border-color);
        }

        @media (max-width: 900px) {
            .hero-overlay-box {
                width: 100%;
                height: auto;
            }
            .hero-banner {
                height: auto;
            }
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .hero-stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            gap: 20px;
            margin-top: 0.5rem;
        }

        .detail-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .detail-section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .wp-content {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-main);
        }

        .wp-content p {
            margin-bottom: 1rem;
            color: var(--text-muted);
        }

        .wp-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 1rem 0;
            border: 1px solid var(--border-color);
            display: block;
        }

        .download-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: var(--bg-color);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .download-group {
            border-left: 3px solid var(--accent-color);
            padding-left: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .download-group-title {
            font-size: 1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .server-link-item {
            color: var(--accent-color);
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s;
        }

        .server-link-item:hover {
            color: var(--accent-hover);
        }

        /* Khung hiển thị Video hướng dẫn */
        .video-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: var(--bg-color);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .video-responsive-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Tỷ lệ 16:9 chuẩn */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #000;
        }

        .video-responsive-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Phần Đánh Giá Sao & Bình Luận */
        .rating-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            padding: 1.2rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .stars-container {
            display: flex;
            gap: 5px;
            cursor: pointer;
        }

        .stars-container i {
            font-size: 1.5rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .stars-container i.active, .stars-container i:hover {
            color: var(--star-color);
        }

        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .comment-input-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comment-textarea {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            resize: vertical;
            min-height: 90px;
            font-size: 0.9rem;
        }

        .comment-textarea:focus {
            border-color: var(--accent-color);
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-item {
            background-color: var(--bg-color);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .comment-author {
            font-weight: 600;
            color: #38bdf8;
        }

        .comment-body {
            font-size: 0.9rem;
            color: var(--text-main);
            word-break: break-word;
        }

        /* Modal Chung */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem 1rem;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .password-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input-container input {
            padding-right: 45px;
            background-color: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .password-input-container input:focus {
            border-color: var(--accent-color);
        }

        .toggle-password-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-password-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.15);
        }

        .styled-input {
            background-color: var(--input-bg) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 8px !important;
        }

        .styled-input:focus {
            border-color: var(--accent-color) !important;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .link-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }

        .link-row select, .link-row input {
            padding: 0.6rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .editor-toolbar {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            padding: 0.5rem;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            background-color: var(--accent-color);
        }

        .editor-content-area {
            width: 100%;
            min-height: 180px;
            max-height: 300px;
            overflow-y: auto;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            padding: 1rem;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <header>
        <a onclick="showHome()" class="logo">
            <span class="logo-badge">R18+</span>
            KuroG18
        </a>
        <div class="search-bar" id="searchContainer">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm game...">
        </div>
        <div class="nav-actions">
            <!-- Nút Quản Lý Bài Đăng (Chỉ hiện khi là Admin) -->
            <button class="btn btn-outline" id="openManageModalBtn" onclick="openManageModal()" style="display: none;"><i class="fa-solid fa-list-check"></i> Quản Lý Bài</button>

            <!-- Nút Đăng Game Mới (Chỉ hiện khi là Admin) -->
            <button class="btn btn-primary" id="openUploadModal" onclick="openUploadModalFunc()" style="display: none;"><i class="fa-solid fa-plus"></i> Đăng Game Mới</button>
            
            <!-- Khu vực tài khoản (Chưa đăng nhập) -->
            <button class="btn btn-outline" id="openAuthModalBtn" onclick="openAuthModal('login')"><i class="fa-solid fa-user"></i> Đăng Nhập</button>

            <!-- Khu vực tài khoản (Đã đăng nhập) -->
            <div id="userAccountSection" style="display: flex; align-items: center; gap: 10px;">
                <span id="userNameDisplay" style="font-size: 0.9rem; font-weight: 600; color: #38bdf8;"></span>
                <button class="btn btn-outline" onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- TRANG CHỦ -->
        <div id="homeView">
            <h2 class="section-title">Danh Sách Game</h2>
            <div class="game-grid" id="gameGrid"></div>
        </div>

        <!-- TRANG CHI TIẾT GAME -->
        <div id="gameDetailView">
            <div class="back-nav-row">
                <button class="back-btn" onclick="showHome()"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</button>
                <!-- Nút Xóa Game -->
                <button class="btn btn-danger" id="deleteGameBtn" style="display: none;"><i class="fa-solid fa-trash"></i> Xóa Bài Viết</button>
            </div>
            <div class="detail-wrapper" id="detailWrapper" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <!-- Modal Đăng Nhập / Đăng Ký -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLoginBtn" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button class="auth-tab" id="tabRegisterBtn" onclick="switchAuthTab('register')">Đăng Ký Tài Khoản</button>
            </div>

            <!-- Form Đăng Nhập -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="styled-input" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="password-input-container">
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">Đăng Nhập</button>
            </form>

            <!-- Form Đăng Ký -->
            <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" class="styled-input" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="password-input-container">
                        <input type="password" id="regPassword" required placeholder="••••••••">

        window.handleEditSubmit = async function(e) {
            e.preventDefault();
            if (!currentUser || currentUser.role !== 'admin') return;

            const firestoreId = document.getElementById('editFirestoreId').value;
            const title = document.getElementById('editGameTitle').value;
            const htmlContent = editWpEditor.innerHTML;
            const imageFileInput = document.getElementById('editGameImageFile');
            const videoFileInput = document.getElementById('editTutorialVideoFile');

            let linksArray = [];
            document.querySelectorAll('.edit-link-row').forEach(row => {
                const platform = row.querySelector('.platform-select').value;
                const name = row.querySelector('.server-name').value;
                const url = row.querySelector('.server-url').value;
                if(name && url) {
                    linksArray.push({ platform, name, url });
                }
            });

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            const plainTextDesc = tempDiv.textContent || tempDiv.innerText || "";
            const shortDesc = plainTextDesc.substring(0, 100) + '...';

            const updateData = {
                title: title,
                fullHtmlContent: htmlContent,
                shortDesc: shortDesc,
                downloadLinks: linksArray
            };

            const processAndSave = async (finalImg, finalVid) => {
                if (finalImg) updateData.image = finalImg;
                if (finalVid) updateData.tutorialVideo = finalVid;

                try {
                    await updateDoc(doc(db, "games", firestoreId), updateData);
                    alert("Cập nhật bài viết thành công!");
                    editModal.style.display = 'none';
                    loadGamesFromFirestore();
                } catch (err) {
                    alert("Lỗi khi cập nhật: " + err.message);
                }
            };

            // Đọc file ảnh mới (nếu có)
            let newImageBase64 = null;
            let newVideoBase64 = null;

            const checkAndSave = () => {
                processAndSave(newImageBase64, newVideoBase64);
            };

            if (imageFileInput.files && imageFileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = scaleSize < 1 ? MAX_WIDTH : img.width;
                        canvas.height = scaleSize < 1 ? img.height * scaleSize : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        newImageBase64 = canvas.toDataURL('image/jpeg', 0.75);

                        if (videoFileInput.files && videoFileInput.files[0]) {
                            const vReader = new FileReader();
                            vReader.onload = function(ve) {
                                newVideoBase64 = ve.target.result;
                                checkAndSave();
                            };
                            vReader.readAsDataURL(videoFileInput.files[0]);
                        } else {
                            checkAndSave();
                        }
                    };
                };
                reader.readAsDataURL(imageFileInput.files[0]);
            } else if (videoFileInput.files && videoFileInput.files[0]) {
                const vReader = new FileReader();
                vReader.onload = function(ve) {
                    newVideoBase64 = ve.target.result;
                    checkAndSave();
                };
                vReader.readAsDataURL(videoFileInput.files[0]);
            } else {
                checkAndSave();
            }
        };

        window.handleEditorImageUpload = function(event) {
            const file = event.target.files[0];

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = scaleSize < 1 ? MAX_WIDTH : img.width;
                    canvas.height = scaleSize < 1 ? img.height * scaleSize : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    const imgHtml = `<img src="${compressedDataUrl}" alt="Image" />`;
                    document.execCommand('insertHTML', false, imgHtml);
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        function renderGames(gamesToRender) {
            gameGrid.innerHTML = '';
            if (gamesToRender.length === 0) {
                gameGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Chưa có tựa game nào được đăng.</p>`;
                return;
            }

            gamesToRender.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => handleGameClick(game.id);

                let avgRating = 0;
                if (game.ratings && game.ratings.length > 0) {
                    const sum = game.ratings.reduce((a, b) => a + b.star, 0);
                    avgRating = (sum / game.ratings.length).toFixed(1);
                }

                card.innerHTML = `
                    <img src="${game.image}" alt="${game.title}" class="game-thumbnail" loading="lazy">
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-desc">${game.shortDesc}</p>
                        <div class="game-footer">
                            <div class="game-stats">
                                <div><span><i class="fa-solid fa-star" style="color: var(--star-color);"></i></span> <span>${avgRating} (${game.ratings ? game.ratings.length : 0})</span></div>
                                <div><span><i class="fa-solid fa-eye"></i></span> <span>${game.views} Views</span></div>
                            </div>
                        </div>
                    </div>
                `;
                gameGrid.appendChild(card);
            });
        }

        function handleGameClick(id) {
            const adKey = `ad_visited_game_${id}`;
            const hasVisited = sessionStorage.getItem(adKey);

            if (!hasVisited) {
                sessionStorage.setItem(adKey, 'true');
                window.open('https://uplcm.com/4/12005179', '_blank');
            }

            openGameDetail(id);
        }

        async function openGameDetail(id) {
            const game = games.find(g => g.id == id);
            if (!game) return;

            game.views++;
            try {
                if (game.firestoreId) {
                    await updateDoc(doc(db, "games", game.firestoreId), {
                        views: game.views
                    });
                }
            } catch (err) {
                console.error(err);
            }

            if (currentUser && currentUser.role === 'admin') {
                deleteGameBtn.style.display = 'inline-flex';
                deleteGameBtn.onclick = () => deleteGame(game.id);
            } else {
                deleteGameBtn.style.display = 'none';
            }

            let groupedLinks = {};
            if (game.downloadLinks) {
                game.downloadLinks.forEach(item => {
                    if (!groupedLinks[item.platform]) {
                        groupedLinks[item.platform] = [];
                    }
                    groupedLinks[item.platform].push(item);
                });
            }

            let downloadBoxesHTML = '';
            for (let platform in groupedLinks) {
                let serversHTML = groupedLinks[platform].map(s => `<a href="${s.url}" target="_blank" class="server-link-item">${s.name}</a>`).join(' | ');
                downloadBoxesHTML += `
                    <div class="download-group">
                        <div class="download-group-title">${platform}: ${serversHTML}</div>
                    </div>
                `;
            }

            // Tạo phần hiển thị Video hướng dẫn tải lên từ máy tính
            let videoSectionHTML = '';
            if (game.tutorialVideo) {
                videoSectionHTML = `
                    <div>
                        <h3 class="detail-section-title">Video Hướng Dẫn Tải & Cài Đặt</h3>
                        <div class="video-container">
                            <div class="video-responsive-wrapper">
                                <video controls preload="metadata">
                                    <source src="${game.tutorialVideo}" type="video/mp4">
                                    Trình duyệt của bạn không hỗ trợ thẻ video.
                                </video>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (!game.ratings) game.ratings = [];
            let avgRating = 0;
            if (game.ratings.length > 0) {
                const sum = game.ratings.reduce((a, b) => a + b.star, 0);
                avgRating = (sum / game.ratings.length).toFixed(1);
            }

            let userExistingRating = 0;
            if (currentUser) {
                let found = game.ratings.find(r => r.userEmail === currentUser.email);
                if (found) userExistingRating = found.star;
            }

            let starsHTML = '';
            for (let i = 1; i <= 5; i++) {
                let activeClass = i <= userExistingRating ? 'active' : '';
                starsHTML += `<i class="fa-solid fa-star ${activeClass}" onclick="rateGame(${game.id}, ${i})"></i>`;
            }

            if (!game.comments) game.comments = [];
            let commentsHTML = game.comments.map(c => `
                <div class="comment-item">
                    <div class="comment-header">
                        <span class="comment-author">${c.author}</span>
                        <span>${c.date}</span>
                    </div>
                    <div class="comment-body">${c.content}</div>
                </div>
            `).join('');

            if (commentsHTML === '') {
                commentsHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">Chưa có bình luận nào. Hãy là người đầu tiên bình luận!</p>`;
            }

            detailWrapper.innerHTML = `
                <div class="hero-banner">
                    <img src="${game.image}" alt="${game.title}" class="hero-bg-img">
                    <div class="hero-overlay-box">
                        <h1 class="hero-title">${game.title}</h1>
                        <div class="hero-stats">
                            <div><i class="fa-solid fa-star" style="color: var(--star-color);"></i> ${avgRating} (${game.ratings.length} đánh giá)</div>
                            <div><i class="fa-solid fa-eye"></i> ${game.views} Views</div>
                        </div>
                    </div>
                </div>

                <div class="detail-card">
                    <div>
                        <h3 class="detail-section-title">Đánh Giá Game (Tối Đa 5 Sao)</h3>
                        <div class="rating-box">
                            <div>
                                <div style="font-weight: 500; font-size: 0.95rem; margin-bottom: 5px;">Chọn số sao đánh giá của bạn:</div>
                                <div class="stars-container" id="starContainer_${game.id}">
                                    ${starsHTML}
                                </div>
                            </div>
                            <div style="margin-left: auto; font-size: 0.9rem; color: var(--text-muted);">
                                Trung bình: <strong style="color: var(--star-color); font-size: 1.1rem;">${avgRating} / 5</strong> (${game.ratings.length} lượt)
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="detail-section-title">Nội Dung Giới Thiệu</h3>
                        <div class="wp-content">${game.fullHtmlContent}</div>
                    </div>

                    <div>
                        <h3 class="detail-section-title">Phần Tải Xuống</h3>
                        <div class="download-container">
                            <div style="font-weight: 600; font-size: 1rem; color: var(--text-main);">Tải Game Về Máy:</div>
                            ${downloadBoxesHTML}
                        </div>
                    </div>

                    ${videoSectionHTML}

                    <div>
                        <h3 class="detail-section-title">Bình Luận (${game.comments.length})</h3>
                        <div class="comments-section">
                            <div class="comment-input-box">
                                <textarea id="commentInputContent" class="comment-textarea" placeholder="${currentUser ? 'Viết bình luận của bạn...' : 'Vui lòng đăng nhập để bình luận...'}"></textarea>
                                <button type="button" class="btn btn-primary" onclick="submitComment(${game.id})" style="align-self: flex-end; padding: 0.5rem 1.2rem; font-size: 0.85rem;"><i class="fa-solid fa-paper-plane"></i> Gửi Bình Luận</button>
                            </div>
                            <div class="comment-list">
                                ${commentsHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            homeView.style.display = 'none';
            gameDetailView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.openGameDetail = openGameDetail;

        async function deleteGame(gameId) {
            if (!currentUser || currentUser.role !== 'admin') {
                alert("Bạn không có quyền thực hiện hành động này!");
                return;
            }

            if (confirm("Hành động này sẽ xóa vĩnh viễn bài viết game. Bạn có chắc chắn không?")) {
                try {
                    const targetGame = games.find(g => g.id == gameId);
                    if (targetGame && targetGame.firestoreId) {
                        await deleteDoc(doc(db, "games", targetGame.firestoreId));
                        alert("Đã xóa bài viết game thành công!");
                        showHome();
                        loadGamesFromFirestore();
                    }
                } catch (error) {
                    alert("Lỗi khi xóa game: " + error.message);
                }
            }
        }
        window.deleteGame = deleteGame;

        window.rateGame = async function(gameId, starCount) {
            if (!currentUser) {
                alert("Bạn cần đăng nhập tài khoản để đánh giá game!");
                openAuthModal('login');
                return;
            }

            const game = games.find(g => g.id == gameId);
            if (!game) return;

            if (!game.ratings) game.ratings = [];

            let existingIndex = game.ratings.findIndex(r => r.userEmail === currentUser.email);
            if (existingIndex !== -1) {
                game.ratings[existingIndex].star = starCount;
            } else {
                game.ratings.push({ userEmail: currentUser.email, star: starCount });
            }

            try {
                if (game.firestoreId) {
                    await updateDoc(doc(db, "games", game.firestoreId), {
                        ratings: game.ratings
                    });
                }
            } catch (err) {
                console.error(err);
            }

            alert(`Cảm ơn bạn đã đánh giá ${starCount} sao cho game!`);
            openGameDetail(gameId);
        };

        window.submitComment = async function(gameId) {
            if (!currentUser) {
                alert("Bạn cần đăng nhập tài khoản để bình luận!");
                openAuthModal('login');
                return;
            }

            const contentBox = document.getElementById('commentInputContent');
            const content = contentBox.value.trim();

            if (!content) {
                alert("Nội dung bình luận không được để trống!");
                return;
            }

            const game = games.find(g => g.id == gameId);
            if (!game) return;

            if (!game.comments) game.comments = [];

            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            game.comments.unshift({
                author: currentUser.email.split('@')[0],
                content: content,
                date: dateStr
            });

            try {
                if (game.firestoreId) {
                    await updateDoc(doc(db, "games", game.firestoreId), {
                        comments: game.comments
                    });
                }
            } catch (err) {
                console.error(err);
            }

            contentBox.value = '';
            openGameDetail(gameId);
        };

        window.showHome = function() {
            gameDetailView.style.display = 'none';
            homeView.style.display = 'block';
            filterAndRender();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        closeModal.addEventListener('click', () => { uploadModal.style.display = 'none'; });
        window.addEventListener('click', (e) => { 
            if (e.target === uploadModal) { uploadModal.style.display = 'none'; }
            if (e.target === authModal) { authModal.style.display = 'none'; }
            if (e.target === manageModal) { manageModal.style.display = 'none'; }
            if (e.target === editModal) { editModal.style.display = 'none'; }
        });

        // Xử lý sự kiện Đăng game mới lên Firestore (bao gồm upload video từ máy)
        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!currentUser || currentUser.role !== 'admin') {
                alert("Bạn không có quyền đăng bài!");
                return;
            }

            const imageFileInput = document.getElementById('gameImageFile');
            const videoFileInput = document.getElementById('tutorialVideoFile');
            const file = imageFileInput.files[0];

            if (!file) {
                alert("Vui lòng chọn ảnh Thumbnail chính!");
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = scaleSize < 1 ? MAX_WIDTH : img.width;
                    canvas.height = scaleSize < 1 ? img.height * scaleSize : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const mainImageBase64 = canvas.toDataURL('image/jpeg', 0.75);

                    const htmlContent = wpEditor.innerHTML;
                    
                    let linksArray = [];
                    const linkRows = document.querySelectorAll('#downloadLinksContainer .link-row');
                    linkRows.forEach(row => {
                        const platform = row.querySelector('.platform-select').value;
                        const name = row.querySelector('.server-name').value;
                        const url = row.querySelector('.server-url').value;
                        if(name && url) {
                            linksArray.push({ platform, name, url });
                        }
                    });

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlContent;
                    const plainTextDesc = tempDiv.textContent || tempDiv.innerText || "";

                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const year = now.getFullYear();
                    const formattedDate = `${day}/${month}/${year}`;

                    const saveGameToFirestore = async (videoBase64 = '') => {
                        const newGame = {
                            id: Date.now(),
                            title: document.getElementById('gameTitle').value,
                            image: mainImageBase64,
                            downloadLinks: linksArray,
                            tutorialVideo: videoBase64,
                            shortDesc: plainTextDesc.substring(0, 100) + '...',
                            fullHtmlContent: htmlContent,
                            views: 0,
                            uploadDate: formattedDate,
                            ratings: [],
                            comments: []
                        };

                        try {
                            await addDoc(collection(db, "games"), newGame);
                            alert("Đăng bài lên website thành công!");
                            uploadForm.reset();
                            wpEditor.innerHTML = '';
                            uploadModal.style.display = 'none';
                            loadGamesFromFirestore();
                        } catch (error) {
                            console.error("Lỗi khi đăng game:", error);
                            alert("Lỗi khi đăng game: " + error.message);
                        }
                    };

                    // Kiểm tra nếu có chọn file video hướng dẫn từ máy tính
                    if (videoFileInput.files && videoFileInput.files[0]) {
                        const videoFile = videoFileInput.files[0];
                        const videoReader = new FileReader();
                        videoReader.onload = function(ve) {
                            saveGameToFirestore(ve.target.result);
                        };
                        videoReader.readAsDataURL(videoFile);
                    } else {
                        saveGameToFirestore('');
                    }
                };
            };
            reader.readAsDataURL(file);
        });

        searchInput.addEventListener('input', () => { filterAndRender(); });

        function filterAndRender() {
            const keyword = searchInput.value.toLowerCase();
            let filtered = games.filter(game => {
                return game.title.toLowerCase().includes(keyword) || game.shortDesc.toLowerCase().includes(keyword);
            });
            renderGames(filtered);
        }

        updateAuthUI();
    </script>
</body>

</html>
